name: Fetch Rust

on:
  push:
    branches: [master]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/fetch/**"
      - ".github/workflows/fetch-rust.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/fetch/**"
      - ".github/workflows/fetch-rust.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: fetch-${{ matrix.os }}
          path: |
            target/release/fetch
            target/release/fetch.exe
          if-no-files-found: ignore
