<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Fetch architecture</title>
  <desc id="desc">Clients pass work through Fetch scheduling, transport, verification, and local persistence layers.</desc>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.accent{fill:#e0f2fe;stroke:#0ea5e9;stroke-width:2}.title{fill:#0f172a;font:700 25px Inter,Segoe UI,Arial,sans-serif}.body{fill:#475569;font:500 17px Inter,Segoe UI,Arial,sans-serif}.small{fill:#0369a1;font:700 15px Inter,Segoe UI,Arial,sans-serif}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="520" rx="28"/>
  <text x="60" y="64" class="title">Fetch architecture</text><text x="60" y="94" class="body">Rust-native transfer pipeline with local-first persistence and explicit compatibility boundaries</text>
  <rect class="panel" x="60" y="150" width="220" height="150" rx="16"/><text x="86" y="192" class="title">Clients</text><text x="86" y="226" class="body">CLI · input files</text><text x="86" y="254" class="body">JSON-RPC · WebSocket</text>
  <rect class="accent" x="360" y="150" width="250" height="150" rx="16"/><text x="386" y="192" class="title">Scheduler</text><text x="386" y="226" class="body">jobs · retries · pause</text><text x="386" y="254" class="body">per-server limits</text>
  <rect class="panel" x="690" y="150" width="210" height="150" rx="16"/><text x="716" y="192" class="title">Adapters</text><text x="716" y="226" class="body">HTTP(S) · FTP(S)</text><text x="716" y="254" class="body">SFTP · BitTorrent</text>
  <rect class="panel" x="980" y="150" width="160" height="150" rx="16"/><text x="1006" y="192" class="title">Files</text><text x="1006" y="226" class="body">staging</text><text x="1006" y="254" class="body">resume</text>
  <path class="arrow" d="M280 225H350"/><path class="arrow" d="M610 225H680"/><path class="arrow" d="M900 225H970"/>
  <rect class="accent" x="360" y="365" width="310" height="96" rx="16"/><text x="386" y="405" class="title">Verification</text><text x="386" y="434" class="body">SHA-256 · Metalink piece hashes</text>
  <rect class="accent" x="760" y="365" width="280" height="96" rx="16"/><text x="786" y="405" class="title">Local state</text><text x="786" y="434" class="body">SQLite jobs · checkpoints</text>
  <path class="arrow" d="M795 300V355H670"/><path class="arrow" d="M1040 300V355"/>
  <text x="60" y="492" class="small">Implemented components are shown as blue surfaces; parity is tracked in COMPATIBILITY.md.</text>
</svg>
