[package]
name = "fetch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A Rust-native, local-first multi-protocol download engine derived from aria2."
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "fetch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
curl = "0.4"
futures-util = "0.3"
hex = "0.4"
md-5 = "0.10"
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
tokio = { version = "1.45", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
url = "2.5"
uuid = { version = "1.17", features = ["v4", "serde"] }

# A maintained, Rust-native BitTorrent engine.  Its session owns peer/DHT
# lifecycle; Fetch only exposes it through the same local scheduler boundary.
librqbit = "9.1"

[dev-dependencies]
tempfile = "3.20"
